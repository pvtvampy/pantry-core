name: Kyron Sequential Source Pipeline

on:
  workflow_dispatch:
    inputs:
      bootstrap_rotation:
        description: Intentionally rebuild and publish Bootstrap
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [fresh-batch]
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/patisserie.yml'
      - '.github/workflows/source-pin.yml'
      - '.github/workflows/project-sdk.yml'
      - '.github/workflows/project-web.yml'
      - '.github/workflows/project-workspace.yml'
      - '.github/workflows/doctor.yml'
      - '.github/workflows/headless.yml'
      - '.github/workflows/box.yml'
      - '.github/actions/private-pin/**'

permissions:
  contents: read

concurrency:
  group: kyron-source-pipeline-main
  cancel-in-progress: false

jobs:
  sources:
    name: 1 · Pin private sources
    uses: ./.github/workflows/source-pin.yml
    secrets: inherit

  sdk:
    name: 2 · SDK project
    needs: sources
    if: ${{ needs.sources.result == 'success' }}
    uses: ./.github/workflows/project-sdk.yml
    with:
      batch_tag: ${{ needs.sources.outputs.batch_tag }}
    secrets: inherit

  web:
    name: 3 · Web project
    needs: sdk
    if: ${{ needs.sdk.result == 'success' }}
    uses: ./.github/workflows/project-web.yml
    with:
      batch_tag: ${{ needs.sources.outputs.batch_tag }}
    secrets: inherit

  workspace:
    name: 4 · Workspace project
    needs: [sources, web]
    if: ${{ needs.web.result == 'success' }}
    uses: ./.github/workflows/project-workspace.yml
    with:
      batch_tag: ${{ needs.sources.outputs.batch_tag }}
      bootstrap_rotation: ${{ inputs.bootstrap_rotation == true }}
    secrets: inherit

  doctor:
    name: 5 · Source validation
    needs: [sources, workspace]
    if: ${{ needs.workspace.result == 'success' }}
    uses: ./.github/workflows/doctor.yml
    with:
      batch_tag: ${{ needs.sources.outputs.batch_tag }}
      delivery_tag: ${{ needs.workspace.outputs.delivery_tag }}
    secrets: inherit

  headless:
    name: 6 · Runtime smoke
    needs: [sources, workspace, doctor]
    if: ${{ needs.doctor.result == 'success' }}
    uses: ./.github/workflows/headless.yml
    with:
      batch_tag: ${{ needs.sources.outputs.batch_tag }}
      delivery_tag: ${{ needs.workspace.outputs.delivery_tag }}
    secrets: inherit

  publish:
    name: 7 · Pantry prepare + publish
    needs: [sources, workspace, headless]
    if: ${{ needs.headless.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/box.yml
    with:
      batch_tag: ${{ needs.sources.outputs.batch_tag }}
      delivery_tag: ${{ needs.workspace.outputs.delivery_tag }}
    secrets: inherit
