name: Cocoa Shell

on:
  workflow_call:
    inputs:
      mix_ref:
        required: true
        type: string
      fold:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      fold:
        description: Fold fresh cream
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cocoa-shell
  cancel-in-progress: false

jobs:
  bake:
    name: Bake cocoa
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Dust counter
        shell: pwsh
        run: |
          Write-Host "::add-mask::$env:GITHUB_REPOSITORY"
          $crumb=$env:GITHUB_REPOSITORY -split '/',2
          foreach($x in $crumb){if($x){Write-Host "::add-mask::$x"}}
      - name: Open recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/table
      - name: Set table
        id: table
        uses: ./recipe/.github/actions/table
        with:
          mix: ${{ secrets.MIX_REPO }}
          mix-key: ${{ secrets[vars.MIX_KEY_NAME] }}
          mix_ref: ${{ inputs.mix_ref || 'main' }}
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
      - name: Chill oven
        uses: actions/cache@v6.1.0
        with:
          path: |
            *-sdk/Android
            *-sdk/Java
            *-sdk/Smali
          key: oven-full-v3-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json', 'mix/scripts/android-bootstrap.ps1', 'mix/scripts/ensure-android-toolchain.ps1', 'mix/scripts/repair-android-toolchain.ps1', 'mix/scripts/repair-pinned-ndk.ps1', 'mix/scripts/workspace-common.ps1') }}

      - name: Chill crumbs
        uses: actions/cache@v6.1.0
        with:
          path: |
            mix/*/obj

          key: cocoa-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            cocoa-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-
      - name: Bake
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          $a=@{Fill=(Join-Path $PWD.Path 'filling');Slice='Cocoa'}
          if('${{ inputs.fold }}'-eq'true'){$a.Fold=$true}
          & ./mix/Tools/BakeSlice.ps1 @a
          exit $LASTEXITCODE
