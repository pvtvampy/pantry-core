name: Moon Mochi

on:
  workflow_call:
    inputs:
      mix_ref:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moon-mochi
  cancel-in-progress: false

jobs:
  bake:
    name: Bake mochi
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Dust counter
        shell: pwsh
        run: |
          Write-Host "::add-mask::$env:GITHUB_REPOSITORY"
          $crumb=$env:GITHUB_REPOSITORY -split '/',2
          foreach($x in $crumb){if($x){Write-Host "::add-mask::$x"}}
      - name: Open recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/table
      - name: Set table
        id: table
        uses: ./recipe/.github/actions/table
        with:
          mix: ${{ secrets.MIX_REPO }}
          mix-key: ${{ secrets[vars.MIX_KEY_NAME] }}
          mix_ref: ${{ inputs.mix_ref || 'main' }}
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
      - name: Chill oven
        uses: actions/cache@v6.1.0
        with:
          path: |
            *-sdk/Android
            *-sdk/Java
            *-sdk/Smali
          key: oven-full-v3-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json', 'mix/scripts/android-bootstrap.ps1', 'mix/scripts/ensure-android-toolchain.ps1', 'mix/scripts/repair-android-toolchain.ps1', 'mix/scripts/repair-pinned-ndk.ps1', 'mix/scripts/workspace-common.ps1') }}

      - name: Chill crumbs
        uses: actions/cache@v6.1.0
        with:
          path: |
            mix/*/obj
            ${{ runner.temp }}/kys-mochi/Cache/BridgeRuntimeLoader
          key: mochi-v4-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json', 'mix/src/android/Bridge/**', 'mix/src/common/Shared/**', 'mix/Tools/BakeSlice.ps1', 'mix/scripts/ensure-android-toolchain.ps1', 'mix/Tools/ToolchainEnv.cmd') }}-${{ github.run_id }}
          restore-keys: |
            mochi-v4-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json', 'mix/src/android/Bridge/**', 'mix/src/common/Shared/**', 'mix/Tools/BakeSlice.ps1', 'mix/scripts/ensure-android-toolchain.ps1', 'mix/Tools/ToolchainEnv.cmd') }}-

      - name: Bake
        shell: pwsh
        run: |
          & ./mix/Tools/BakeSlice.ps1 -Fill (Join-Path $PWD.Path 'filling') -Slice Mochi
          exit $LASTEXITCODE
