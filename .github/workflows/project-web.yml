name: Project Web

on:
  workflow_call:
    inputs:
      batch_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify web project
    runs-on: ubuntu-24.04
    steps:
      - name: Open workflow helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/private-pin

      - name: Resolve private web pin
        id: pin
        uses: ./recipe/.github/actions/private-pin
        with:
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
          batch-tag: ${{ inputs.batch_tag }}
          project: web

      - name: Open private web project
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pin.outputs.repo }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.pin.outputs.ref }}
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          show-progress: false

      - name: Set Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify web project quietly
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'project-web.log'
          $dir=Join-Path $PWD.Path 'source/kyron-suite/v11.5.0'
          try{
            Push-Location $dir
            & npm run build *>&1 | Set-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'web build rejected'}
            & npm test *>&1 | Add-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'web tests rejected'}
            & npm install --global wrangler@4.127.1 *>&1 | Add-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'worker tool install rejected'}
            & wrangler deploy --config worker/wrangler.jsonc --dry-run *>&1 | Add-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'worker dry-run rejected'}
            Write-Host '[PROJECT/WEB][OK]'
          }catch{
            Write-Host '[PROJECT/WEB][FAIL]'
            exit 1
          }finally{
            Pop-Location -ErrorAction SilentlyContinue
            if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
          }
