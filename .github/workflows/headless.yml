name: Pantry Runtime Smoke

on:
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Headless serial checks
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      KYRON_SERIAL_BUILD: '1'
      KYRON_BUILD_JOBS: '1'
    steps:
      - name: Open capsule helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/private-capsule

      - name: Open private Workspace state
        id: state
        uses: ./recipe/.github/actions/private-capsule
        with:
          mode: open
          key: ${{ secrets[vars.MIX_KEY_NAME] }}
          capsule: ${{ inputs.capsule }}
          project: workspace

      - name: Open private Workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.workspace_repo }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.state.outputs.workspace_ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Open private Pantry delivery
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.pantry_repo }}
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          ref: ${{ steps.state.outputs.pantry_ref }}
          path: filling
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Run headless matrix serially and quietly
        shell: pwsh
        run: |
          $targets=@(
            @{Configuration='Debug';Platform='x64'},
            @{Configuration='Debug';Platform='Win32'},
            @{Configuration='Release';Platform='x64'},
            @{Configuration='Release';Platform='Win32'}
          )
          foreach($target in $targets){
            $log=Join-Path $env:RUNNER_TEMP ("headless-{0}-{1}.log"-f$target.Configuration,$target.Platform)
            try{
              & ./source/Tools/Test-KyronHeadless.ps1 -Suite All -Configuration $target.Configuration -Platform $target.Platform *>&1 | Set-Content -LiteralPath $log
              if($LASTEXITCODE){throw 'headless rejected'}
              Write-Host ("[HEADLESS][OK] configuration={0} platform={1}"-f$target.Configuration,$target.Platform)
            }catch{
              Write-Host ("[HEADLESS][FAIL] configuration={0} platform={1}"-f$target.Configuration,$target.Platform)
              exit 1
            }finally{
              if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
            }
          }
