name: Headless Core

on:
  workflow_call:
    inputs:
      mix_ref:
        required: true
        type: string
      fill_ref:
        required: false
        default: main
        type: string
  workflow_dispatch:
    inputs:
      mix_ref:
        description: Source ref
        required: false
        default: main
        type: string
      fill_ref:
        description: Delivery ref
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: headless-core
  cancel-in-progress: false

jobs:
  test:
    name: Headless serial checks
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      KYRON_SERIAL_BUILD: '1'
      KYRON_BUILD_JOBS: '1'
    steps:
      - name: Open recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/table
      - name: Set table
        uses: ./recipe/.github/actions/table
        with:
          mix: ${{ secrets.MIX_REPO }}
          mix-key: ${{ secrets[vars.MIX_KEY_NAME] }}
          mix_ref: ${{ inputs.mix_ref || 'main' }}
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
          fill_ref: ${{ inputs.fill_ref || 'main' }}
      - name: Run headless suite one by one
        shell: powershell
        working-directory: mix
        run: |
          $targets=@(
            @{Configuration='Debug';Platform='x64'},
            @{Configuration='Debug';Platform='Win32'},
            @{Configuration='Release';Platform='x64'},
            @{Configuration='Release';Platform='Win32'}
          )
          foreach($target in $targets){
            Write-Host ("[HEADLESS][SERIAL] configuration={0} platform={1}" -f $target.Configuration,$target.Platform)
            & .\Tools\Test-KyronHeadless.ps1 -Suite All -Configuration $target.Configuration -Platform $target.Platform
            if($LASTEXITCODE){exit $LASTEXITCODE}
          }
