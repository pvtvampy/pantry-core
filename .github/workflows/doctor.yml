name: Pantry Source Validation

on:
  workflow_call:
    inputs:
      batch_tag:
        required: true
        type: string
      delivery_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    steps:
      - name: Open workflow helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/private-pin

      - name: Resolve private Workspace pin
        id: pin
        uses: ./recipe/.github/actions/private-pin
        with:
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
          batch-tag: ${{ inputs.batch_tag }}
          delivery-tag: ${{ inputs.delivery_tag }}
          project: workspace

      - name: Open private Workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pin.outputs.repo }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.pin.outputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Taste quietly
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'doctor-portable.log'
          try{
            & ./source/Tools/BakeDoctor.ps1 -Mode Portable -Fill (Join-Path $PWD.Path 'filling') *>&1 | Set-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'portable rejected'}
            Write-Host '[DOCTOR/PORTABLE][OK]'
          }catch{
            $phase='unknown'
            if(Test-Path $log){$m=[regex]::Match((Get-Content -LiteralPath $log -Raw),'(?m)^DOCTOR_SAFE_PHASE=([a-z0-9-]{1,48})\r?$');if($m.Success){$phase=$m.Groups[1].Value}}
            Write-Host "[DOCTOR/PORTABLE][FAIL] phase=$phase"
            exit 1
          }finally{
            if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
          }

  windows:
    name: Windows checks
    needs: portable
    if: ${{ needs.portable.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Open workflow helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/private-pin

      - name: Resolve private Workspace pin
        id: pin
        uses: ./recipe/.github/actions/private-pin
        with:
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
          batch-tag: ${{ inputs.batch_tag }}
          delivery-tag: ${{ inputs.delivery_tag }}
          project: workspace

      - name: Open private Workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pin.outputs.repo }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.pin.outputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Taste quietly
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'doctor-windows.log'
          try{
            & ./source/Tools/BakeDoctor.ps1 -Mode Windows -Fill (Join-Path $PWD.Path 'filling') *>&1 | Set-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'windows rejected'}
            Write-Host '[DOCTOR/WINDOWS][OK]'
          }catch{
            $phase='unknown'
            if(Test-Path $log){$m=[regex]::Match((Get-Content -LiteralPath $log -Raw),'(?m)^DOCTOR_SAFE_PHASE=([a-z0-9-]{1,48})\r?$');if($m.Success){$phase=$m.Groups[1].Value}}
            Write-Host "[DOCTOR/WINDOWS][FAIL] phase=$phase"
            exit 1
          }finally{
            if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
          }
