name: Pantry Prepare + Publish

on:
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Prepare and publish Pantry Core
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Open capsule helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/private-capsule

      - name: Open private Workspace state
        id: state
        uses: ./recipe/.github/actions/private-capsule
        with:
          mode: open
          key: ${{ secrets[vars.MIX_KEY_NAME] }}
          capsule: ${{ inputs.capsule }}
          project: workspace

      - name: Open private Workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.workspace_repo }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.state.outputs.workspace_ref }}
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          show-progress: false

      - name: Open private Pantry delivery
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.pantry_repo }}
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          ref: ${{ steps.state.outputs.pantry_ref }}
          path: filling
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Open Pantry Core publish target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: shelf
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Chill publisher Python
        uses: actions/cache@v6.1.0
        with:
          path: '*-sdk/Python'
          key: pantry-publisher-python-v3-${{ runner.os }}-${{ hashFiles('source/toolchains.lock.json') }}

      - name: Prepare and publish quietly
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'pantry-publish.log'
          try{
            $a=@{
              Fill=(Join-Path $PWD.Path 'filling')
              Shelf=(Join-Path $PWD.Path 'shelf')
              Slice='Box'
              Batch=[long]'${{ github.run_id }}'
              Try=[int]'${{ github.run_attempt }}'
            }
            & ./source/Tools/BakeSlice.ps1 @a *>&1 | Set-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'Pantry Core publication rejected'}
            Write-Host '[PANTRY/PUBLISH][OK] private Pantry prepared and public Core published'
          }catch{
            $phase='unknown'
            if(Test-Path $log){
              $m=[regex]::Match((Get-Content -LiteralPath $log -Raw),'(?m)^\[Patisserie\]\[FAIL\] phase=([a-z0-9-]{1,64})')
              if($m.Success){$phase=$m.Groups[1].Value}
            }
            Write-Host "[PANTRY/PUBLISH][FAIL] phase=$phase"
            exit 1
          }finally{
            if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
          }
