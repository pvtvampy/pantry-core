name: Pantry Prepare + Publish

on:
  workflow_call:
    inputs:
      mix_ref:
        required: true
        type: string
      fold:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: night-box
  cancel-in-progress: false

jobs:
  pack:
    name: Prepare and publish Pantry snapshot
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Dust counter
        shell: pwsh
        run: |
          Write-Host "::add-mask::$env:GITHUB_REPOSITORY"
          $crumb=$env:GITHUB_REPOSITORY -split '/',2
          foreach($x in $crumb){if($x){Write-Host "::add-mask::$x"}}
      - name: Open recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/table
      - name: Set table
        uses: ./recipe/.github/actions/table
        with:
          mix: ${{ secrets.MIX_REPO }}
          mix-key: ${{ secrets[vars.MIX_KEY_NAME] }}
          mix_ref: ${{ inputs.mix_ref || 'main' }}
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
          shelf: 'true'
          shelf_ref: ${{ github.sha }}
      - name: Chill flour
        uses: actions/cache@v6.1.0
        with:
          path: '*-sdk/Python'
          key: flour-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}

      - name: Pack
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          $a=@{
            Fill=(Join-Path $PWD.Path 'filling')
            Shelf=(Join-Path $PWD.Path 'shelf')
            Slice='Box'
            Batch=[long]'${{ github.run_id }}'
            Try=[int]'${{ github.run_attempt }}'
          }
          if('${{ inputs.fold }}'-eq'true'){$a.Fold=$true}
          & ./mix/Tools/BakeSlice.ps1 @a
          exit $LASTEXITCODE
