name: Open private pin
description: Resolve masked private source pins from the private delivery repository
inputs:
  fill:
    required: true
  fill-key:
    required: true
  batch-tag:
    required: true
  delivery-tag:
    required: false
    default: ''
  project:
    required: true
outputs:
  repo:
    value: ${{ steps.pin.outputs.repo }}
  ref:
    value: ${{ steps.pin.outputs.ref }}
  fill_ref:
    value: ${{ steps.delivery.outputs.fill_ref }}
runs:
  using: composite
  steps:
    - name: Mask private repository
      shell: pwsh
      env:
        FILL_REPO: ${{ inputs.fill }}
      run: |
        if([string]::IsNullOrWhiteSpace($env:FILL_REPO)){throw 'private delivery repository unavailable'}
        Write-Host "::add-mask::$env:FILL_REPO"

    - name: Resolve private delivery commit
      id: delivery
      shell: pwsh
      env:
        FILL_REPO: ${{ inputs.fill }}
        FILL_KEY: ${{ inputs.fill-key }}
        BATCH_TAG: ${{ inputs.batch-tag }}
        DELIVERY_TAG: ${{ inputs.delivery-tag }}
      run: |
        $ErrorActionPreference='Stop'
        $ref=if([string]::IsNullOrWhiteSpace($env:DELIVERY_TAG)){$env:BATCH_TAG}else{$env:DELIVERY_TAG}
        if($ref-notmatch '^pastry-(source|delivery)-[0-9]+-[0-9]+$'){throw 'private delivery ref rejected'}
        $headers=@{Authorization="Bearer $env:FILL_KEY";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
        try{$commit=Invoke-RestMethod -Headers $headers -Uri ("https://api.github.com/repos/{0}/commits/{1}"-f $env:FILL_REPO,[Uri]::EscapeDataString($ref)) -Method Get}
        catch{throw 'private delivery ref resolution failed'}
        $sha=([string]$commit.sha).Trim().ToLowerInvariant()
        if($sha-notmatch '^[0-9a-f]{40}$'){throw 'private delivery commit rejected'}
        Write-Host "::add-mask::$sha"
        "fill_ref=$sha" >> $env:GITHUB_OUTPUT

    - name: Open private delivery
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.fill }}
        token: ${{ inputs.fill-key }}
        ref: ${{ steps.delivery.outputs.fill_ref }}
        path: filling
        fetch-depth: 1
        fetch-tags: false
        lfs: false
        persist-credentials: true
        show-progress: false

    - name: Resolve private project pin
      id: pin
      shell: pwsh
      env:
        BATCH_TAG: ${{ inputs.batch-tag }}
        PROJECT: ${{ inputs.project }}
      run: |
        $ErrorActionPreference='Stop'
        if($env:BATCH_TAG-notmatch '^pastry-source-[0-9]+-[0-9]+$'){throw 'private source tag rejected'}
        & git -C filling fetch --quiet --force origin "refs/tags/$env:BATCH_TAG`:refs/tags/$env:BATCH_TAG" 1>$null 2>$null
        if($LASTEXITCODE){throw 'private source tag fetch failed'}
        $msg=((& git -C filling tag -l $env:BATCH_TAG '--format=%(contents)')-join"`n")
        if($LASTEXITCODE){throw 'private source tag read failed'}
        $prefix=switch($env:PROJECT){'workspace'{'workspace'}'sdk'{'sdk'}'web'{'web'}default{throw 'private project selector rejected'}}
        $repo=[regex]::Match($msg,("(?m)^{0}_repo=(.+)$"-f[regex]::Escape($prefix))).Groups[1].Value.Trim()
        $ref=[regex]::Match($msg,("(?m)^{0}_ref=([0-9a-f]{{40}})$"-f[regex]::Escape($prefix))).Groups[1].Value.Trim().ToLowerInvariant()
        if([string]::IsNullOrWhiteSpace($repo)-or$repo-notmatch '^[^/\s]+/[^/\s]+$'-or$ref-notmatch'^[0-9a-f]{40}$'){throw 'private project pin rejected'}
        Write-Host "::add-mask::$repo"
        Write-Host "::add-mask::$ref"
        "repo=$repo" >> $env:GITHUB_OUTPUT
        "ref=$ref" >> $env:GITHUB_OUTPUT
        Write-Host '[PIN][OK] private project pin resolved'
