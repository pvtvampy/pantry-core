name: Set table
description: Prepare a quiet pastry bench
# Workspace pin refresh: e2f9b99
inputs:
  mix:
    required: true
  mix-key:
    required: true
  mix_ref:
    required: false
    default: main
  fill:
    required: true
  fill-key:
    required: true
  fill_ref:
    required: false
    default: main
  shelf:
    required: false
    default: 'false'
  shelf_ref:
    required: false
    default: main
outputs:
  ndk_cache_path:
    description: Canonical pinned Android NDK cache path
    value: ${{ steps.oven.outputs.path }}
runs:
  using: composite
  steps:
    - name: Dust counter
      shell: pwsh
      env:
        MIX: ${{ inputs.mix }}
        FILL: ${{ inputs.fill }}
      run: |
        Write-Host "::add-mask::$env:MIX"
        Write-Host "::add-mask::$env:FILL"
    - name: Open counter
      if: ${{ inputs.shelf == 'true' }}
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.shelf_ref }}
        path: shelf
        fetch-depth: 1
        persist-credentials: true
        show-progress: false

    - name: Measure flour
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.mix }}
        token: ${{ inputs.mix-key }}
        ref: ${{ inputs.mix_ref }}
        path: mix
        fetch-depth: 1
        fetch-tags: false
        lfs: false
        persist-credentials: true
        show-progress: false
    - name: Map oven
      id: oven
      shell: pwsh
      run: |
        $lock=Get-Content -LiteralPath (Join-Path $PWD.Path 'mix/toolchains.lock.json') -Raw|ConvertFrom-Json
        $version=[string]$lock.android.ndkVersion
        if($version -notmatch '^\d+(?:\.\d+){2}$'){throw 'Pinned Android NDK version rejected'}
        "path=*-sdk/Android/sdk/ndk/$version" >> $env:GITHUB_OUTPUT
    - name: Whip cream
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.fill }}
        token: ${{ inputs.fill-key }}
        ref: ${{ inputs.fill_ref }}
        path: filling
        fetch-depth: 1
        fetch-tags: false
        lfs: false
        persist-credentials: true
        show-progress: false
